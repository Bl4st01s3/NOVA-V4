<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NOVA OBS Overlay</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* Required for OBS Browser Source to be transparent */
            background-color: transparent;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="nova-canvas"></canvas>

    <!-- Scripts -->
    <script type="text/javascript" src="/eel.js"></script>
    <script src="obs.js"></script>
</body>
</html>
